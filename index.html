<!doctype html><html lang="uk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FBI: Language Agent</title><style>body{font-family:Arial;margin:0;background:#f3f4f6;color:#17202a}header,main{max-width:1050px;margin:auto}header{padding:18px;background:white}main{padding:15px}.card{background:white;border:1px solid #ddd;border-radius:15px;padding:20px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.buttons{display:flex;flex-wrap:wrap;gap:8px}button{padding:11px 14px;border:0;border-radius:9px;background:#202a35;color:white;cursor:pointer}.chat{background:#f8fafc;padding:12px;border-radius:10px;min-height:220px}.m{padding:10px;margin:7px;border-radius:10px;background:white}.a{background:#e7eef8;margin-left:15%}.ev{display:inline-block;background:#f1f3f5;padding:8px;margin:4px;border-radius:8px}.loc{min-width:120px}@media(max-width:750px){.grid{grid-template-columns:1fr}}</style><header>🕵️ <b>FBI: Language Agent</b>　⭐ XP: <span id=xp>0</span></header><main><div class=card><h1 id=title>CASE #001</h1><p id=desc>Розслідуй справи англійською та вчи мову через гру.</p><div class=buttons id=levels></div></div><div class=grid><section><div class=card><h2>🗺️ Locations</h2><div class=buttons id=places></div></div><div class=card><h2>💬 Interview Room</h2><div class=chat id=chat>Choose a location.</div><div class=buttons id=ans></div></div></section><aside><div class=card><h2>🔎 Evidence</h2><div id=ev>No evidence yet</div></div><div class=card><h2>📖 Vocabulary</h2><div id=words></div></div><div class=card><h2>⭐ Progress</h2><div id=level>Rookie Agent</div></div></aside></div></main><script>const L=[['The Missing Scientist',['scientist','witness','laboratory','jacket'],[['🧪','Laboratory','I saw Dr. Wilson. He wore a black jacket.','What did he wear?',['Red hat','Black jacket','Blue shirt'],1,'Black jacket'],['🚉','Train Station','A man with a red bag got on the train.','What did he have?',['Red bag','Black jacket','Laptop'],0,'Red bag'],['🏨','Hotel','Dr. Wilson booked room 204.','Which room?',['102','204','404'],1,'Room 204']]],['The Stolen Painting',['painting','museum','security','frame'],[['🖼️','Museum','The painting was on the wall at 8 PM.','Where was it?',['Museum','Hotel','Station'],0,'Museum'],['📹','Security Room','The camera saw a person in a green coat.','What did they wear?',['Blue coat','Green coat','Black hat'],1,'Green coat'],['🏛️','Gallery','I noticed an empty frame.','What was empty?',['Box','Frame','Bag'],1,'Empty frame']]],['The Secret Message',['message','code','sender','meeting'],[['💼','Office','The message says: Meet at the bridge at six.','Where is the meeting?',['Bridge','Hotel','Museum'],0,'Bridge meeting'],['🗄️','Archive','The sender used the name Agent Fox.','Who sent it?',['Agent Wolf','Agent Fox','Agent Blue'],1,'Agent Fox'],['🌉','Bridge','A person arrived at six o’clock.','When?',['5 PM','6 PM','7 PM'],1,'6 PM']]],['The Airport Mystery',['airport','passenger','passport','flight'],[['✈️','Airport','The passenger carried a small black suitcase.','What did they carry?',['Suitcase','Bicycle','Painting'],0,'Black suitcase'],['🎫','Check-in','His flight number was 417.','What was the flight?',['147','417','714'],1,'Flight 417'],['🛋️','Lounge','He showed a passport before entering.','What did he show?',['Ticket','Passport','Map'],1,'Passport']]],['The Cyber Intruder',['password','computer','account','intruder'],[['🖥️','Server Room','Someone logged into the account at midnight.','When?',['Noon','Midnight','Morning'],1,'Midnight login'],['🔐','Control Room','The intruder tried the wrong password three times.','What was wrong?',['Password','Name','Address'],0,'Wrong password'],['📱','Office','I saw a person using the computer after midnight.','What did they use?',['Phone','Computer','Camera'],1,'Computer use']]],['The Final Operation',['operation','suspect','evidence','escape'],[['📦','Warehouse','The suspect left through the north door.','Which door?',['South','East','North'],2,'North door'],['⚓','Harbor','I saw the suspect near the boat at 10 PM.','Where?',['Near the boat','Hotel','Office'],0,'Near the boat'],['🎯','Control Center','We have enough evidence to stop the escape.','Enough evidence?',['No','Yes','Unknown'],1,'Enough evidence']]]];let n=0,xp=0,seen=[];const $=id=>document.getElementById(id);function load(i){n=i;seen=[];let l=L[i];$('title').textContent=`CASE #00${i+1} — ${l[0]}`;$('desc').textContent=i==5?'Final operation: become an Elite Agent.':'Solve the case using English.';$('chat').innerHTML='Choose a location.';$('ans').innerHTML='';$('ev').innerHTML='No evidence yet';$('places').innerHTML='';l[2].forEach((p,j)=>{let b=document.createElement('button');b.className='loc';b.textContent=p[0]+' '+p[1];b.onclick=()=>visit(j);$('places').append(b)});$('words').innerHTML=l[1].map(w=>`<span class=ev><b>${w}</b></span>`).join(' ')}function visit(j){let p=L[n][2][j];$('chat').innerHTML+=`<div class="m a"><b>Agent:</b> Let's investigate ${p[1]}.</div><div class=m><b>Witness:</b> ${p[2]}</div>`;$('ans').innerHTML='';p[4].forEach((o,k)=>{let b=document.createElement('button');b.textContent=o;b.onclick=()=>answer(p,k);$('ans').append(b)})}function answer(p,k){if(k==p[5]){xp+=25;$('xp').textContent=xp;if(!seen.includes(p[6]))seen.push(p[6]);$('ev').innerHTML=seen.map(e=>`<span class=ev>🔎 ${e}</span>`).join('');$('chat').innerHTML+=`<div class="m a">✅ Correct! Evidence added.</div>`;if(seen.length==3){xp+=50;$('xp').textContent=xp;$('chat').innerHTML+=`<div class=m><b>🏆 CASE SOLVED!</b> Level ${n+1} complete.</div>`}}else $('chat').innerHTML+=`<div class="m a">❌ Try again. Read carefully.</div>`;$('level').textContent=xp>=300?'Elite Agent':xp>=150?'Field Agent':'Rookie Agent'}L.forEach((l,i)=>{let b=document.createElement('button');b.textContent='Level '+(i+1);b.onclick=()=>load(i);$('levels').append(b)});load(0)</script></html>
